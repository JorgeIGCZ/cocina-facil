<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Cocina</title>
  <meta name="theme-color" content="#f7f1fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Cocina">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="192x192" href="/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="app"></main>
  <nav id="tabs" aria-label="Secciones de Mi Cocina" hidden>
    <button data-tab="semana"><span>🗓️</span>Semana</button>
    <button data-tab="platillos"><span>📖</span>Platillos</button>
    <button data-tab="refri"><span aria-hidden="true">🏠</span>En casa</button>
    <button data-tab="super"><span>🛒</span>Súper</button>
    <button data-tab="mas"><span>⚙️</span>Más</button>
  </nav>
  <dialog id="sheet" aria-labelledby="sheet-titulo"></dialog>
  <div id="toast" role="status"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
